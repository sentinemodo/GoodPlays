services:
  postgres:
    image: postgres:16-alpine
    container_name: goodplays-postgres
    environment:
      POSTGRES_DB: goodplays
      POSTGRES_USER: goodplays
      POSTGRES_PASSWORD: goodplays
    ports:
      - "5432:5432"
    volumes:
      - goodplays_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodplays -d goodplays"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: goodplays-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  goodplays_pg_data:
